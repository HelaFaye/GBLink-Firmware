# HelaFaye fork only: never part of a pull request to GB-Link.
#
# Changes meant for GB-Link/GBLink-Firmware are tested here first, as pull
# requests into this fork's copy of the upstream branch. Upstream's own
# build.yml runs only for main, so this repeats its firmware build (same
# Zephyr SDK and board) for those pull requests, keeps the .uf2 for testing
# on hardware, and runs the host tests in tests/host.
name: Fork test

on:
  pull_request:
    branches: [4-player-combined-refactor]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Host tests
        run: make -C tests/host run
      - name: Host tests under ASan and UBSan
        run: |
          make -C tests/host clean
          make -C tests/host run \
            CXXFLAGS="-std=c++20 -Wall -Wextra -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all"

  firmware:
    runs-on: ubuntu-latest
    env:
      ZEPHYR_SDK_VERSION: 0.16.8
    steps:
      - uses: actions/checkout@v6
        with:
          path: gblink-firmware

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install west
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache ninja-build gperf

      - name: Initialize west workspace
        run: |
          west init -l gblink-firmware
          west update
          west zephyr-export

      - name: Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz
          cd zephyr-sdk-${ZEPHYR_SDK_VERSION}
          ./setup.sh -t arm-zephyr-eabi -c

      - name: Install Zephyr Python dependencies
        run: pip install -r zephyr/scripts/requirements.txt

      - name: Build firmware
        run: west build -b rpi_pico gblink-firmware

      - name: Keep the firmware
        uses: actions/upload-artifact@v7
        with:
          name: gblink-fork-test
          path: build/zephyr/zephyr.uf2
